<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATRIX: 28th BIRTHDAY PROTOCOL</title>
    <style>
        :root {
            --neon-green: #00ff41;
            --dark-bg: #050505;
            --panel-bg: rgba(10, 10, 10, 0.9);
        }

        body {
            background-color: var(--dark-bg);
            color: #e0e0e0;
            font-family: 'Courier New', 'Microsoft JhengHei', monospace;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* 酷炫動態背景網格 */
        #bg-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; opacity: 0.15;
            transition: opacity 1s ease;
        }

        #main-frame {
            width: 90%; max-width: 500px;
            background: var(--panel-bg);
            padding: 2.5rem;
            border: 1px solid var(--neon-green);
            box-shadow: 0 0 40px rgba(0, 255, 65, 0.15);
            position: relative; z-index: 10;
            backdrop-filter: blur(5px);
        }

        /* 出場動畫 */
        .fade-in { animation: glitch 0.4s ease-out forwards; }
        @keyframes glitch {
            0% { opacity: 0; transform: scale(0.9); filter: hue-rotate(90deg); }
            100% { opacity: 1; transform: scale(1); filter: hue-rotate(0deg); }
        }

        .welcome-text {
            font-size: 0.8rem; letter-spacing: 4px; color: var(--neon-green);
            margin-bottom: 1rem; border-right: 2px solid var(--neon-green);
            white-space: nowrap; overflow: hidden;
            width: fit-content; animation: typing 2s steps(20), blink .5s step-end infinite;
        }
        @keyframes typing { from { width: 0 } to { width: 100% } }
        @keyframes blink { from, to { border-color: transparent } 50% { border-color: var(--neon-green) } }

        h1.main-title {
            color: var(--neon-green); font-size: 2.8rem;
            text-shadow: 0 0 20px var(--neon-green); margin: 0.5rem 0;
        }

        .option-btn {
            background: rgba(0, 255, 65, 0.05); color: #fff;
            border: 1px solid var(--neon-green); padding: 1.1rem;
            text-align: left; cursor: pointer; transition: 0.2s;
            margin-bottom: 1rem; width: 100%; font-size: 0.95rem;
            position: relative;
        }
        .option-btn:hover {
            background: var(--neon-green); color: #000;
            box-shadow: 0 0 20px var(--neon-green); transform: translateX(5px);
        }

        .progress-bar { height: 2px; background: #222; width: 100%; margin-top: 2rem; }
        #progress-fill { height: 100%; background: var(--neon-green); width: 0%; transition: 0.5s; }

        .input-name-field {
            width: calc(100% - 24px); padding: 12px; margin: 1.5rem 0;
            background: #000; border: 1px solid var(--neon-green);
            color: var(--neon-green); font-size: 1.2rem; outline: none;
        }

        .summary-box {
            background: rgba(0, 255, 65, 0.1); border-left: 3px solid var(--neon-green);
            padding: 1rem; margin-top: 1.5rem; font-size: 0.9rem; line-height: 1.6;
        }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div id="main-frame">
    <div id="game-ui"></div>
    <div class="progress-bar"><div id="progress-fill"></div></div>
</div>

<script>
    // 背景矩陣動畫
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const columns = Math.floor(canvas.width / 20);
    const drops = new Array(columns).fill(1);

    function drawMatrix() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#0f0';
        ctx.font = '15px monospace';
        for (let i = 0; i < drops.length; i++) {
            const text = String.fromCharCode(Math.random() * 128);
            ctx.fillText(text, i * 20, drops[i] * 20);
            if (drops[i] * 20 > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        }
    }
    setInterval(drawMatrix, 50);

    // 測驗題庫
    const questions = [
        { q: "🍹 考試滿分的手搖獎勵？", options: ["八曜牧場307 🥛", "茶湯會金桂觀音珍珠拿鐵 🍵🧋", "林三凍檸茶 🍋🧊", "八曜 柚迷人 😍🍊", "一沐日桂花粉粿檸檬 🌼🍋", "午後時光的奶茶 ☕"] },
        { q: "😈 5xN 臨時爽約，你怎麼懲罰？", options: ["記小帳默默算帳 😌🧾", "逼他請飲料 🧋🤝", "發限動讓大家公審 📱🔥"] },
        { q: "🏝️ 孤島生存只能帶一樣？", options: ["超哥沒電的電動牙刷 🪥⚡", "跟吳承恩的情侶泳褲 🍋🩳", "安姆士的招牌養生拌飯 🍚🥗"] },
        { q: "🎲 猜拳輸了必須接受懲罰？", options: ["穿全綠套裝 🟢👕", "兩週不喝手搖 🚫🧋", "跟吳承恩跳女團舞 💃🎶"] },
        { q: "🌋 什麼事件讓你火山爆發？", options: ["吳承恩遲到 2 小時 ⏰😤", "超哥做報告一直在睡 😴📄", "車子被撞到擦傷 🚗💥"] },
        { q: "🌙 半夜群組很吵，內心 OS？", options: ["吳承恩又在耍帥 🔪😠", "超哥又被公幹了 😂🍿", "可能在約飯局？ 🍽️👀", "露比分享美食 📸🍰"] },
        { q: "🧋 點手搖最不能接受？", options: ["甜度變七分糖 🍬❌", "檸檬品項檸檬曠課 🍋🚫", "珍珠換成波霸 ⚫🔄"] },
        { q: "🏊‍♂️ 泳訓最不想游哪個菜單？", options: ["施教練重訓 🥵", "甲組魔鬼菜單 👿", "愚人節菜單 🤡", "當全職經理 📋"] },
        { q: "😱💬 聽到什麼八卦會驚掉下巴？", options: ["吳承恩是蓋 🤯", "超哥愛上你 😍", "自己已熱戀中 💖", "吳承恩密謀求婚 💍"] },
        { q: "🧢 一定要選一頂泳帽？", options: ["檸檬泳帽 🍋", "鯊魚泳帽 🦈", "網球泳帽 🎾"] },
        { q: "⚡🏠 宿舍停電超哥想進房？", options: ["一秒鎖門 🔒", "開20個瓶蓋 🫙", "簽除蟲契約 🪳", "跳 Overdrive 🎤"] },
        { q: "💇✨ 挑戰一個新髮型？", options: ["兄弟平頭 ✂️", "雙色挑染 🌈", "美式前刺 🦔", "金髮男神 💛"] }
    ];

    const finalResults = [
        { name: "林三凍檸茶", desc: "你是林三凍檸茶的 VVVVIP！清新但有原則。" },
        { name: "星太郎超[寬]條餅", desc: "擁有太平洋寬肩，給人十足安全感。" },
        { name: "生乳捲", desc: "工工卷哥，不捲也能拿書卷，實力擔當。" },
        { name: "日曆", desc: "跟變頻冷氣一樣高冷，高效穩定的存在。" },
        { name: "筷子", desc: "效率極高，卻願意為了朋友慢下來等待。" },
        { name: "樂事 (香菜口味)", desc: "品味獨特，你是人群中最亮眼的香菜知音。" }
    ];

    let currentSession = [];
    let currentIndex = 0;
    let score = 0;
    let userName = "";
    let selectedChoices = []; // 紀錄玩家選了什麼

    function renderUI(state) {
        const ui = document.getElementById('game-ui');
        ui.innerHTML = '';
        ui.className = 'fade-in';

        if (state === 'cover') {
            ui.innerHTML = `
                <div class="welcome-text">WELCOME_TO_STATION...</div>
                <h1 class="main-title">餓了吧~~</h1>
                <p style="color:var(--neon-green); font-size:0.9rem;">🎮 1.21限定・28的闖關測驗</p>
                <p style="line-height:1.6; font-size:0.9rem;">請帶著愉快心情開啟<br>多重賽道 × 命運爬梯</p>
                <p style="color:#888; font-size:0.8rem; margin:1.5rem 0;">⚠️ 請誠實回答到最後一頁</p>
                <div style="margin-bottom:1.5rem; letter-spacing:2px;">Take your mark</div>
                <button class="option-btn" style="text-align:center" onclick="renderUI('name')">[ GO! ]</button>
            `;
        } else if (state === 'name') {
            ui.innerHTML = `
                <h2>嗨~請輸入你的名字?</h2>
                <input type="text" id="nameInput" class="input-name-field" placeholder="INPUT_NAME...">
                <button class="option-btn" style="text-align:center" onclick="saveName()">[ START ]</button>
            `;
        } else if (state === 'quiz') {
            const q = currentSession[currentIndex];
            document.getElementById('progress-fill').style.width = `${(currentIndex / 6) * 100}%`;
            ui.innerHTML = `
                <div style="font-size:0.7rem; color:var(--neon-green);">LOG: SESSION_0${currentIndex+1}</div>
                <h2 style="font-size:1.1rem;">${q.q}</h2>
                ${q.options.map((o, i) => `<button class="option-btn" onclick="next(${i})">${o}</button>`).join('')}
            `;
        } else if (state === 'result') {
            const res = finalResults[score % 6];
            document.getElementById('progress-fill').style.width = `100%`;
            
            // 巧妙地將選項轉化為祝福
            const review = selectedChoices.map(c => c.split(' ')[0]).join('、');
            
            ui.innerHTML = `
                <div style="color:var(--neon-green); font-size:0.7rem;">ANALYSIS_COMPLETE</div>
                <h1 style="color:var(--neon-green); margin:0.5rem 0;">你是：${res.name}</h1>
                <p style="line-height:1.6;">${res.desc}</p>
                <div class="summary-box">
                    <strong>📊 本次測驗回顧：</strong><br>
                    ${userName} 在過程中選擇了「${review}」等精彩路徑。<br><br>
                    <strong>✨ 生日祝福矩陣：</strong><br>
                    在新的一歲裡，願你保有選 <strong>${selectedChoices[0]}</strong> 的那份初心，
                    即使遇到 <strong>${selectedChoices[4]}</strong> 這種鳥事也能一笑置之。
                    願生活像 <strong>${selectedChoices[2]}</strong> 一樣精彩，
                    就像大家對你的愛一樣，永遠是 VVVVIP 級別的喔！
                </div>
                <button class="option-btn" style="text-align:center; margin-top:2rem;" onclick="location.reload()">RE-DECODE</button>
            `;
        }
    }

    window.saveName = () => {
        userName = document.getElementById('nameInput').value || "挑戰者";
        currentSession = [...questions].sort(() => Math.random() - 0.5).slice(0, 6);
        renderUI('quiz');
    };

    window.next = (i) => {
        selectedChoices.push(currentSession[currentIndex].options[i]);
        score += i;
        currentIndex++;
        if (currentIndex < 6) renderUI('quiz');
        else renderUI('result');
    };

    renderUI('cover');
</script>
</body>
</html>
